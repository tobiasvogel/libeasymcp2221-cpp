name: Build main Debian snapshots

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main-debs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  C_LIBRARY_REPOSITORY: tobiasvogel/libeasymcp2221
  C_LIBRARY_REF: v2.0.0

jobs:
  build:
    name: Build ${{ matrix.distro.name }} ${{ matrix.distro.suite }} ${{ matrix.arch.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - { name: debian, suite: bookworm, image: "debian:bookworm" }
          - { name: debian, suite: trixie, image: "debian:trixie" }
          - { name: ubuntu, suite: "22.04", image: "ubuntu:22.04" }
          - { name: ubuntu, suite: "24.04", image: "ubuntu:24.04" }
        arch:
          - { name: amd64, platform: "linux/amd64" }
          - { name: arm64, platform: "linux/arm64" }
          - { name: armhf, platform: "linux/arm/v7" }
        include:
          - distro: { name: rpios, suite: bookworm, image: "balenalib/rpi-raspbian:bookworm" }
            arch: { name: armv6, platform: "linux/arm/v6" }

    steps:
      - name: Check out C++ repository
        uses: actions/checkout@v5
        with:
          path: cpp

      - name: Check out pinned C dependency
        uses: actions/checkout@v5
        with:
          repository: ${{ env.C_LIBRARY_REPOSITORY }}
          ref: ${{ env.C_LIBRARY_REF }}
          path: c

      - name: Generate snapshot version
        id: version
        working-directory: cpp
        shell: bash
        run: |
          project_version="$(
            sed -nE \
              's/^project\(libeasymcp2221_cpp VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' \
              CMakeLists.txt
          )"
          test -n "${project_version}"
          build_date="$(date -u +%Y%m%d)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          snapshot_version="${project_version}+git${build_date}.${short_sha}-1"
          echo "version=${snapshot_version}" >> "${GITHUB_OUTPUT}"

      - name: Enable QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Build architecture packages
        env:
          IMAGE: ${{ matrix.distro.image }}
          PLATFORM: ${{ matrix.arch.platform }}
          SNAPSHOT_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf cpp/out
          mkdir -p cpp/out

          docker run --rm -t \
            --platform "${PLATFORM}" \
            -e SNAPSHOT_VERSION="${SNAPSHOT_VERSION}" \
            -v "${PWD}/cpp:/src" \
            -v "${PWD}/c:/cdep:ro" \
            -w /src \
            "${IMAGE}" bash -lc '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              export DEBFULLNAME="GitHub Actions"
              export DEBEMAIL="github-actions@users.noreply.github.com"

              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates \
                build-essential \
                devscripts \
                equivs \
                debhelper \
                dpkg-dev \
                fakeroot \
                ninja-build

              # Build and install the pinned libeasymcp2221 dependency first.
              cp -a /cdep /tmp/cdep
              cd /tmp/cdep
              # TODO: Remove this workaround once the pinned libeasymcp2221
              # release includes pkgconf in debian/control Build-Depends.
              apt-get install -y --no-install-recommends pkgconf

              mk-build-deps -i -t "apt-get -y --no-install-recommends" -r debian/control
              rm -f ./*build-deps*.deb || true
              dpkg-buildpackage -us -uc -B
              c_runtime_deb="$(
                find .. -maxdepth 1 -type f -name "*.deb" -print \
                  | while IFS= read -r deb; do
                      if [ "$(dpkg-deb -f "${deb}" Package)" = "libeasymcp2221-2" ]; then
                        printf "%s\n" "${deb}"
                        break
                      fi
                    done
              )"
              c_dev_deb="$(
                find .. -maxdepth 1 -type f -name "*.deb" -print \
                  | while IFS= read -r deb; do
                      if [ "$(dpkg-deb -f "${deb}" Package)" = "libeasymcp2221-dev" ]; then
                        printf "%s\n" "${deb}"
                        break
                      fi
                    done
              )"
              test -n "${c_runtime_deb}"
              test -n "${c_dev_deb}"
              apt-get install -y "${c_runtime_deb}" "${c_dev_deb}"

              # Install the C++ package build dependencies now that the local
              # libeasymcp2221-dev package satisfies the >= 2.0.0 dependency.
              # Architecture-specific packages do not contain documentation;
              # the separate Bookworm Architecture: all job builds the doc package.
              cd /src
              export DEB_BUILD_PROFILES=nodoc
              export DEB_BUILD_OPTIONS=nodoc
              mk-build-deps -i -t "apt-get -y --no-install-recommends" -r debian/control
              rm -f ./*build-deps*.deb || true

              dch \
                -b \
                --newversion "${SNAPSHOT_VERSION}" \
                --distribution UNRELEASED \
                "Automated development snapshot from the main branch."

              dpkg-buildpackage -us -uc -B

              # Install the freshly built packages back into the same clean
              # distribution container. The pinned C dependency is already
              # installed here, so apt can validate the complete dependency
              # chain without relying on a distribution copy of libeasymcp2221.
              cpp_runtime_deb="$(
                find .. -maxdepth 1 -type f -name "*.deb" -print \
                  | while IFS= read -r deb; do
                      if [ "$(dpkg-deb -f "${deb}" Package)" = "libeasymcp2221++0" ]; then
                        printf "%s\n" "${deb}"
                        break
                      fi
                    done
              )"
              cpp_dev_deb="$(
                find .. -maxdepth 1 -type f -name "*.deb" -print \
                  | while IFS= read -r deb; do
                      if [ "$(dpkg-deb -f "${deb}" Package)" = "libeasymcp2221++-dev" ]; then
                        printf "%s\n" "${deb}"
                        break
                      fi
                    done
              )"
              test -n "${cpp_runtime_deb}"
              test -n "${cpp_dev_deb}"

              test "$(dpkg-deb -f "${cpp_runtime_deb}" Architecture)" = "$(dpkg --print-architecture)"
              test "$(dpkg-deb -f "${cpp_dev_deb}" Architecture)" = "$(dpkg --print-architecture)"
              dpkg-deb -c "${cpp_runtime_deb}" | grep -F "libeasymcp2221++.so.0"
              dpkg-deb -c "${cpp_dev_deb}" | grep -F "/usr/include/libeasymcp2221++/Device.h"
              dpkg-deb -c "${cpp_dev_deb}" | grep -F "libeasymcp2221++.a"
              dpkg-deb -c "${cpp_dev_deb}" | grep -F "libeasymcp2221++.pc"
              dpkg-deb -c "${cpp_dev_deb}" | grep -F "libeasymcp2221-cppConfig.cmake"

              cpp_dev_depends="$(dpkg-deb -f "${cpp_dev_deb}" Depends)"
              printf "%s\n" "${cpp_dev_depends}" | grep -F "libeasymcp2221++0"
              printf "%s\n" "${cpp_dev_depends}" | grep -F "libeasymcp2221-dev"

              apt-get install -y "${cpp_runtime_deb}" "${cpp_dev_deb}"

              # Compile and link consumers against the installed package
              # metadata. Do not execute them: CI has no MCP2221 hardware.
              cat >/tmp/consumer.cpp <<'"'"'EOF'"'"'
              #include <libeasymcp2221++/Device.h>

              void instantiateDevice()
              {
                  libeasymcp2221::Device device;
              }

              int main()
              {
                  return 0;
              }
              EOF

              c++ -std=c++17 /tmp/consumer.cpp \
                $(pkg-config --cflags --libs "libeasymcp2221++") \
                -o /tmp/pkgconfig-consumer

              mkdir -p /tmp/cmake-consumer
              cat >/tmp/cmake-consumer/CMakeLists.txt <<'"'"'EOF'"'"'
              cmake_minimum_required(VERSION 3.10)
              project(installed_package_consumer LANGUAGES CXX)
              find_package(libeasymcp2221-cpp CONFIG REQUIRED)
              add_executable(installed-package-consumer /tmp/consumer.cpp)
              target_link_libraries(
                  installed-package-consumer
                  PRIVATE
                  libeasymcp2221::cpp
              )
              EOF
              cmake -S /tmp/cmake-consumer -B /tmp/cmake-consumer/build -GNinja
              cmake --build /tmp/cmake-consumer/build

              # Consumer validation changes the shell working directory through
              # CMake internals and must not affect where package artifacts are
              # collected. Use the absolute package paths discovered above and
              # collect metadata explicitly from the Debian build parent.
              cp -v "${cpp_runtime_deb}" "${cpp_dev_deb}" /src/out/
              find / -maxdepth 1 -type f \( -name "*.buildinfo" -o -name "*.changes" \) -exec cp -v {} /src/out/ \;
              chown -R --reference=/src /src/out
            '

      - name: Normalize snapshot asset names
        working-directory: cpp
        env:
          TARGET_SUFFIX: ${{ matrix.distro.name }}-${{ matrix.distro.suite }}-${{ matrix.arch.name }}
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'out/*.deb' >/dev/null
          for deb in out/*.deb; do
            package="$(dpkg-deb -f "${deb}" Package)"
            version="$(dpkg-deb -f "${deb}" Version)"
            mv -v "${deb}" "out/${package}_${version}_${TARGET_SUFFIX}.deb"
          done

      - name: Upload architecture snapshot artifacts
        uses: actions/upload-artifact@v6
        with:
          name: debs-main-${{ steps.version.outputs.version }}-${{ matrix.distro.name }}-${{ matrix.distro.suite }}-${{ matrix.arch.name }}
          path: cpp/out/
          if-no-files-found: error
          retention-days: 30

  build-doc:
    name: Build Debian bookworm all documentation package
    runs-on: ubuntu-latest

    steps:
      - name: Check out C++ repository
        uses: actions/checkout@v5
        with:
          path: cpp

      - name: Check out pinned C dependency
        uses: actions/checkout@v5
        with:
          repository: ${{ env.C_LIBRARY_REPOSITORY }}
          ref: ${{ env.C_LIBRARY_REF }}
          path: c

      - name: Generate snapshot version
        id: version
        working-directory: cpp
        shell: bash
        run: |
          project_version="$(
            sed -nE \
              's/^project\(libeasymcp2221_cpp VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' \
              CMakeLists.txt
          )"
          test -n "${project_version}"
          build_date="$(date -u +%Y%m%d)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          snapshot_version="${project_version}+git${build_date}.${short_sha}-1"
          echo "version=${snapshot_version}" >> "${GITHUB_OUTPUT}"

      - name: Build architecture-independent documentation package
        env:
          SNAPSHOT_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf cpp/out-doc
          mkdir -p cpp/out-doc

          docker run --rm -t \
            --platform linux/amd64 \
            -e SNAPSHOT_VERSION="${SNAPSHOT_VERSION}" \
            -v "${PWD}/cpp:/src" \
            -v "${PWD}/c:/cdep:ro" \
            -w /src \
            debian:bookworm bash -lc '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              export DEBFULLNAME="GitHub Actions"
              export DEBEMAIL="github-actions@users.noreply.github.com"

              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates \
                build-essential \
                devscripts \
                equivs \
                debhelper \
                dpkg-dev \
                fakeroot \
                ninja-build

              cp -a /cdep /tmp/cdep
              cd /tmp/cdep
              # TODO: Remove this workaround once the pinned libeasymcp2221
              # release includes pkgconf in debian/control Build-Depends.
              apt-get install -y --no-install-recommends pkgconf

              mk-build-deps -i -t "apt-get -y --no-install-recommends" -r debian/control
              rm -f ./*build-deps*.deb || true
              dpkg-buildpackage -us -uc -B
              c_runtime_deb="$(
                find .. -maxdepth 1 -type f -name "*.deb" -print \
                  | while IFS= read -r deb; do
                      if [ "$(dpkg-deb -f "${deb}" Package)" = "libeasymcp2221-2" ]; then
                        printf "%s\n" "${deb}"
                        break
                      fi
                    done
              )"
              c_dev_deb="$(
                find .. -maxdepth 1 -type f -name "*.deb" -print \
                  | while IFS= read -r deb; do
                      if [ "$(dpkg-deb -f "${deb}" Package)" = "libeasymcp2221-dev" ]; then
                        printf "%s\n" "${deb}"
                        break
                      fi
                    done
              )"
              test -n "${c_runtime_deb}"
              test -n "${c_dev_deb}"
              apt-get install -y "${c_runtime_deb}" "${c_dev_deb}"

              cd /src
              mk-build-deps -i -t "apt-get -y --no-install-recommends" -r debian/control
              rm -f ./*build-deps*.deb || true

              dch \
                -b \
                --newversion "${SNAPSHOT_VERSION}" \
                --distribution UNRELEASED \
                "Automated development snapshot from the main branch."

              dpkg-buildpackage -us -uc -A

              doc_deb="$(find .. -maxdepth 1 -type f -name "libeasymcp2221++-doc_*_all.deb" -print -quit)"
              test -n "${doc_deb}"
              cp -v "${doc_deb}" /src/out-doc/
              chown -R --reference=/src /src/out-doc
            '

      - name: Validate documentation package
        working-directory: cpp
        shell: bash
        run: |
          set -euo pipefail
          doc_deb="$(find out-doc -type f -name 'libeasymcp2221++-doc_*_all.deb' -print -quit)"
          test -n "${doc_deb}"
          test "$(dpkg-deb -f "${doc_deb}" Package)" = "libeasymcp2221++-doc"
          test "$(dpkg-deb -f "${doc_deb}" Architecture)" = "all"

          rm -rf package-root
          mkdir package-root
          dpkg-deb -x "${doc_deb}" package-root
          test -f "package-root/usr/share/doc/libeasymcp2221++-doc/html/index.html"

      - name: Upload architecture-independent snapshot artifact
        uses: actions/upload-artifact@v6
        with:
          name: debs-main-${{ steps.version.outputs.version }}-debian-bookworm-all
          path: cpp/out-doc/
          if-no-files-found: error
          retention-days: 30
